<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dankotuwa & Royal — Check Sheet</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f1f5f9;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;--pri:#1d4ed8;--ok:#15803d;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,'Iskoola Pota',sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
#loading{padding:60px;text-align:center;font-size:16px;color:var(--mut)}
.loginBox{max-width:380px;margin:80px auto;background:#fff;padding:32px;border-radius:14px;border:1px solid var(--line);box-shadow:0 4px 20px rgba(0,0,0,.06)}
.loginBox h2{margin:0 0 20px;text-align:center}
.loginBox input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;font-family:inherit}
.loginBox button{width:100%;padding:11px;background:var(--pri);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.loginBox p{text-align:center;margin-top:14px;font-size:13px;color:var(--mut)}
header{background:linear-gradient(135deg,#1e3a8a,#0284c7);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header b{font-size:16px}
#userEmail{font-size:12px;opacity:.85;margin-left:8px}
.roleBadge{padding:3px 9px;border-radius:14px;font-size:11px;font-weight:700;margin-left:8px;background:rgba(255,255,255,.2)}
.role-admin{background:#f59e0b}
.role-viewer{background:#64748b}
.btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:rgba(255,255,255,.3)}
.btn.ghost{background:transparent}
nav{display:flex;gap:2px;background:#fff;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:20}
nav button{background:none;border:none;padding:13px 16px;cursor:pointer;font-size:13.5px;font-family:inherit;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav button.active{color:var(--pri);border-bottom-color:var(--pri)}
main{padding:16px;max-width:1900px;margin:0 auto}
.tab{display:none}.tab.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .lbl{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat .val{font-size:22px;font-weight:700;margin-top:6px}
.stat.ok .val{color:var(--ok)}.stat.bad .val{color:var(--bad)}.stat.pri .val{color:var(--pri)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
input[type=text],input[type=search],select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;outline:none}
input:focus,select:focus{border-color:#0284c7;box-shadow:0 0 0 3px rgba(2,132,199,.15)}
.tblwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:#1e293b;color:#fff;padding:9px 10px;text-align:left;font-weight:600;font-size:11.5px;white-space:nowrap;z-index:5}
tbody td{padding:6px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover td{background:#f8fafc}
tbody td[contenteditable]:focus{outline:2px solid #0284c7;background:#eff6ff;white-space:normal}
td.cell-ok{color:var(--ok)}td.cell-bad{color:var(--bad);font-weight:600}
td.act{width:38px;text-align:center}
button.del{background:#fee2e2;color:#b91c1c;border:none;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:12px}
button.del:hover{background:#fecaca}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}
.pager button{padding:6px 13px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px}
.pager button:disabled{opacity:.4;cursor:default}
#chatWrap{display:flex;flex-direction:column;height:calc(100vh - 260px);min-height:400px}
#chatLog{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.55;font-size:13.5px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg table{margin:8px 0;font-size:12px;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:100%}
.msg th{background:#334155;color:#fff;padding:5px 8px;font-size:11px;text-align:left}
.msg td{padding:4px 8px;border-top:1px solid #f1f5f9}
#chatInput{display:flex;gap:8px;margin-top:10px}
#chatInput input{flex:1;padding:11px 14px;border-radius:10px}
#chatInput button{padding:11px 20px;background:var(--pri);color:#fff;border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;padding:5px 11px;border-radius:20px;font-size:12px;cursor:pointer}
.chip:hover{background:#bae6fd}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:820px;max-height:90vh;overflow:auto;padding:20px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.form input, .form select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;width:100%}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal-foot button{padding:9px 18px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;font-size:13px}
.modal-foot button.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
</style>
</head>
<body>

<!-- ⚠️ මෙතනට ඔයාගේ Google Web App URL එක දාන්න -->
<script>
const GOOGLE_SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxus3IeFKsZpMmkxqeLaP8H5_Bk2f8C7NXZQlvrdPaiKN3dw_xhBPMYFaXy7zr1F7ULFQ/exec'; 
</script>

<div id="loading">⏳ Loading...</div>

<div id="loginScreen" style="display:none">
  <div class="loginBox">
    <h2>📦 Check Sheet Login</h2>
    <input type="password" id="loginPassword" placeholder="Enter Password (admin123 / viewer)">
    <button onclick="doLogin()">Login</button>
    <p style="font-size:11px;color:#94a3b8">Admin: admin123<br>Viewer: viewer</p>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="appScreen" style="display:none">
  <header>
    <div>
      <b>📦 Check Sheet</b>
      <span id="userEmail"></span>
      <span id="userRole" class="roleBadge"></span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="btnAdd" class="btn">➕ Manual Add</button>
      <button id="btnExport" class="btn">⬇ Export</button>
      <button onclick="doLogout()" class="btn ghost">Logout</button>
    </div>
  </header>

  <nav>
    <button data-tab="dash" class="active">Dashboard</button>
    <button data-tab="dankotuwa">Dankotuwa old</button>
    <button data-tab="royal">Royal frn</button>
    <button data-tab="bot">🤖 AI Bot</button>
  </nav>

  <main>
    <section id="tab-dash" class="tab active">
      <div id="dashBody"></div>
    </section>
    <section id="tab-grid" class="tab">
      <div class="card">
        <div class="toolbar">
          <input type="search" id="search" placeholder="🔍 Search..." style="flex:1;min-width:240px">
          <select id="statusFilter">
            <option value="">All Status</option>
            <option value="CHKD">CHKD</option>
            <option value="RTN">RTN</option>
          </select>
          <span id="sheetLabel" style="font-weight:600;color:var(--pri)"></span>
        </div>
        <div class="tblwrap">
          <table>
            <thead id="gridHead"></thead>
            <tbody id="gridBody"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="prevPage">◀ Prev</button>
          <span id="pageInfo"></span>
          <button id="nextPage">Next ▶</button>
        </div>
      </div>
    </section>
    <section id="tab-bot" class="tab">
      <div class="card" style="padding:14px">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
          <h3 style="margin:0">🤖 AI Assistant</h3>
          <button id="btnAiNewJob" style="background:#15803d;color:#fff;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-weight:bold;display:none">➕ Start New Job</button>
        </div>
        <div id="chatWrap">
          <div id="chatLog"></div>
          <div id="chatInput">
            <input type="text" id="chatBox" placeholder="ප්‍රශ්නයක් අහන්න... (උදා: 183985)">
            <button id="chatSend">Ask ➤</button>
          </div>
          <div class="chips" id="chips"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const FIELDS = ["JOB NO","JB DATE","VEH NO","Driver","ROUTE","CUSTOMER","CUS CODE","INV NO",
"ALL Pg No","AMOUNT","CUSTOMER SEAL","CHK DATE","JOB TYPE","REMARKS","JOB STATUS",
"Handover To","ENTERED BY","ENTERED AT"];
const FIELD_KEYS = {"JOB NO":"job_no","JB DATE":"jb_date","VEH NO":"veh_no","Driver":"driver","ROUTE":"route",
"CUSTOMER":"customer","CUS CODE":"cus_code","INV NO":"inv_no","ALL Pg No":"all_pg_no","AMOUNT":"amount",
"CUSTOMER SEAL":"customer_seal","CHK DATE":"chk_date","JOB TYPE":"job_type","REMARKS":"remarks",
"JOB STATUS":"job_status","Handover To":"handover_to","ENTERED BY":"entered_by","ENTERED AT":"entered_at"};
const SHEET_NAMES = { dankotuwa:"Dankotuwa old", royal:"Royal frn" };

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const num = v => { const n = parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; };
const money = n => n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

let user = null, role = 'viewer', allData = [], cur = 'dankotuwa', page = 1;
const PER = 50;
let botState = { mode:'query', sheet:null, data:{}, step:0, fieldsToFill:['INV NO','JOB NO','VEH NO','AMOUNT','CUSTOMER','CUSTOMER SEAL','CHK DATE','REMARKS'] };

// API CONNECTION
async function fetchData() {
  $('#loading').style.display = 'block';
  $('#loading').innerText = '⏳ Syncing with Google Sheets...';
  try {
    const res = await fetch(GOOGLE_SHEET_API_URL);
    allData = await res.json();
    allData = allData.map(r => {
       r.id = String(r.id || '');
       r.amount = String(r.amount || '');
       return r;
    });
    $('#loading').style.display = 'none';
    renderAll();
  } catch(e) {
    $('#loading').innerText = '❌ Error: ' + e.message;
  }
}

async function syncAction(action, payload) {
  const res = await fetch(GOOGLE_SHEET_API_URL, {
    method: 'POST',
    body: JSON.stringify({ action: action, data: payload })
  });
  return await res.json();
}

// ================================================================
// AUTH (Simple Local)
// ================================================================
function doLogin() {
  const p = $('#loginPassword').value;
  if (p === 'Cs@6252') {
    role = 'admin'; user = { email: 'Admin' };
  } else if (p === 'viewer') {
    role = 'viewer'; user = { email: 'Viewer' };
  } else {
    $('#loginMsg').textContent = '❌ Incorrect password!';
    return;
  }
  $('#userEmail').textContent = user.email;
  $('#userRole').textContent = role.toUpperCase();
  $('#userRole').className = 'roleBadge role-' + role;
  
  $('#loginScreen').style.display = 'none';
  $('#appScreen').style.display = 'block';
  applyRoleUI();
  fetchData();
}

function doLogout() {
  user = null; role = 'viewer'; allData = [];
  $('#appScreen').style.display = 'none';
  $('#loginScreen').style.display = 'block';
  $('#loginPassword').value = '';
  $('#loginMsg').textContent = '';
}

function applyRoleUI() {
  const admin = role === 'admin';
  $('#btnAdd').style.display = admin ? 'inline-flex' : 'none';
  $('#btnAiNewJob').style.display = admin ? 'block' : 'none';
}

// ================================================================
// GRID RENDER
// ================================================================
function renderGrid(){
  const q = ($('#search')?.value||'').toLowerCase();
  const st = ($('#statusFilter')?.value||'').toUpperCase();
  
  let rows = allData.filter(r => r.sheet === cur);
  
  if(q) rows = rows.filter(r => FIELDS.some(f => String(r[FIELD_KEYS[f]]||'').toLowerCase().includes(q)));
  if(st) rows = rows.filter(r => String(r.job_status||'').toUpperCase().includes(st));
  
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total/PER));
  if(page>pages) page = pages;
  const slice = rows.slice((page-1)*PER, page*PER);
  const admin = role==='admin';

  $('#gridHead').innerHTML = '<tr>' + FIELDS.map(f=>`<th>${esc(f)}</th>`).join('') + (admin?'<th></th>':'') + '</tr>';

  if(!slice.length){
    $('#gridBody').innerHTML = `<tr><td colspan="${FIELDS.length+(admin?1:0)}" style="text-align:center;padding:40px;color:#94a3b8">දත්ත නැහැ</td></tr>`;
  } else {
    $('#gridBody').innerHTML = slice.map(r => {
      const tds = FIELDS.map(f => {
        const v = r[FIELD_KEYS[f]] || '';
        let cls = '';
        if(f==='CUSTOMER SEAL') cls = /❌/.test(v)?'cell-bad':(/✅/.test(v)?'cell-ok':'');
        if(f==='JOB STATUS'){ const u=v.toUpperCase(); cls = u.includes('RTN')?'cell-bad':(u.includes('CHKD')?'cell-ok':''); }
        return `<td ${admin?'contenteditable="true"':''} class="${cls}" data-id="${r.id}" data-k="${FIELD_KEYS[f]}">${esc(v)}</td>`;
      }).join('');
      return `<tr>${tds}${admin?`<td class="act"><button class="del" data-id="${r.id}">✕</button></td>`:''}</tr>`;
    }).join('');
  }
  $('#pageInfo').textContent = `Page ${page}/${pages} — ${total}`;
  $('#prevPage').disabled = page<=1;
  $('#nextPage').disabled = page>=pages;
}

document.addEventListener('focusout', async e => {
  const td = e.target.closest('td[contenteditable="true"]'); if(!td) return;
  const id = td.dataset.id, key = td.dataset.k, nv = td.innerText.trim();
  const rec = allData.find(r => r.id === id);
  if(!rec || String(rec[key]||'') === nv) return;
  
  td.innerText = 'Saving...';
  await syncAction('update', { id: id, key: key, value: nv });
  rec[key] = nv;
  td.innerText = nv;
  td.className = '';
});

document.addEventListener('click', async e => {
  const b = e.target.closest('.del'); if(!b) return;
  if(!confirm('Delete this row?')) return;
  const id = b.dataset.id;
  await syncAction('delete', { id: id });
  allData = allData.filter(r => r.id !== id);
  renderAll();
});

$('#search')?.addEventListener('input', ()=>{page=1;renderGrid()});
$('#statusFilter')?.addEventListener('change', ()=>{page=1;renderGrid()});
$('#prevPage')?.addEventListener('click', ()=>{if(page>1){page--;renderGrid()}});
$('#nextPage')?.addEventListener('click', ()=>{page++;renderGrid()});

// ================================================================
// MANUAL NEW ENTRY
// ================================================================
$('#btnAdd')?.addEventListener('click', () => {
  if(role !== 'admin') return;
  const html = FIELDS.map(f => `<label>${esc(f)}<input data-k="${FIELD_KEYS[f]}"></label>`).join('');
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `<div class="modal-box"><h3>➕ Manual Add Job</h3>
    <label style="font-weight:bold;margin-bottom:10px;display:block">Select Sheet:
      <select id="modalSheet" style="padding:8px;border-radius:6px;margin-top:5px;width:100%;max-width:300px">
        <option value="dankotuwa" ${cur==='dankotuwa'?'selected':''}>Dankotuwa old</option>
        <option value="royal" ${cur==='royal'?'selected':''}>Royal frn</option>
      </select>
    </label>
    <div class="form">${html}</div>
    <div class="modal-foot"><button class="cancel">Cancel</button><button class="primary save">Save Job</button></div></div>`;
  document.body.appendChild(modal);
  modal.querySelector('.cancel').onclick = () => modal.remove();
  modal.querySelector('.save').onclick = async () => {
    const targetSheet = modal.querySelector('#modalSheet').value;
    const o = { sheet: targetSheet };
    modal.querySelectorAll('input[data-k]').forEach(i => o[i.dataset.k] = i.value.trim());
    if(!Object.values(o).some(v => v && v !== targetSheet)){ alert('Fill at least one field'); return; }
    if(!o.entered_at) o.entered_at = new Date().toISOString();
    
    modal.querySelector('.save').innerText = 'Saving...';
    await syncAction('add', o);
    modal.remove();
    await fetchData();
  };
});

// ================================================================
// DASHBOARD
// ================================================================
function calcStats(arr){
  const s = {n:arr.length, chkd:0, rtn:0, amt:0, sealBad:0, veh:{}};
  arr.forEach(r => {
    const st = String(r.job_status||'').toUpperCase();
    if(st.includes('CHKD')) s.chkd++;
    else if(st.includes('RTN')) s.rtn++;
    s.amt += num(r.amount);
    if(/❌/.test(r.customer_seal||'')) s.sealBad++;
    const v = String(r.veh_no||'').trim().toUpperCase();
    if(v) s.veh[v] = (s.veh[v]||0)+1;
  });
  return s;
}

function renderDash(){
  const dData = allData.filter(r => r.sheet === 'dankotuwa');
  const rData = allData.filter(r => r.sheet === 'royal');
  const d = calcStats(dData), r = calcStats(rData);
  
  const card = (l,v,c='') => `<div class="stat ${c}"><div class="lbl">${l}</div><div class="val">${v}</div></div>`;
  const topVeh = arr => {
    const e = Object.entries(calcStats(arr).veh).sort((a,b)=>b[1]-a[1]).slice(0,6);
    if(!e.length) return '<div style="color:#94a3b8;padding:10px">—</div>';
    return '<table style="width:100%;font-size:13px"><tbody>' +
      e.map(([v,c],i)=>`<tr><td style="padding:4px 0">${i+1}. <b>${esc(v)}</b></td><td style="text-align:right;color:#64748b">${c} jobs</td></tr>`).join('') +
      '</tbody></table>';
  };
  $('#dashBody').innerHTML = `
    <h3>📋 Dankotuwa old</h3>
    <div class="stats">
      ${card('Total', d.n, 'pri')}${card('CHKD', d.chkd, 'ok')}${card('RTN', d.rtn, 'bad')}
      ${card('Amount', 'Rs ' + money(d.amt), 'pri')}${card('Seal Issues', d.sealBad, 'bad')}
    </div>
    <div class="card"><b>🚚 Top Vehicles</b>${topVeh(dData)}</div>
    <h3 style="margin-top:22px">📋 Royal frn</h3>
    <div class="stats">
      ${card('Total', r.n, 'pri')}${card('CHKD', r.chkd, 'ok')}${card('RTN', r.rtn, 'bad')}
      ${card('Amount', 'Rs ' + money(r.amt), 'pri')}${card('Seal Issues', r.sealBad, 'bad')}
    </div>
    <div class="card"><b>🚚 Top Vehicles</b>${topVeh(rData)}</div>
  `;
}

// ================================================================
// AI BOT & NEW ENTRY WIZARD
// ================================================================
function printTable(rows) {
  let html = `<html><head><title>Print Report</title>
  <style>body{font-family:sans-serif;font-size:12px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #000;padding:6px;text-align:left}th{background:#ddd}</style>
  </head><body><h2>Check Sheet Report</h2><p>Date: ${new Date().toLocaleDateString()}</p>
  <table><tr><th>Sheet</th><th>Job No</th><th>Job Date</th><th>Veh No</th><th>Customer</th><th>Inv No</th><th>Chk Date</th><th>Remarks</th><th>Job Status</th><th>Handover To</th></tr>`;
  rows.forEach(r => {
    html += `<tr><td>${SHEET_NAMES[r.sheet]}</td><td>${esc(r.job_no||'')}</td><td>${esc(r.jb_date||'')}</td><td>${esc(r.veh_no||'')}</td><td>${esc(r.customer||'')}</td><td>${esc(r.inv_no||'')}</td><td>${esc(r.chk_date||'')}</td><td>${esc(r.remarks||'')}</td><td>${esc(r.job_status||'')}</td><td>${esc(r.handover_to||'')}</td></tr>`;
  });
  html += `</table></body></html>`;
  const win = window.open('', '', 'width=1000,height=800');
  win.document.write(html); win.document.close(); win.focus();
  setTimeout(() => { win.print(); win.close(); }, 500);
}

function formatFullDetails(rows) {
  if (rows.length === 0) return "";
  if (rows.length === 1) {
    const r = rows[0];
    return `📄 **Details for ${SHEET_NAMES[r.sheet]} INV: ${r.inv_no}**\n\n` +
           `• **Job No:** ${r.job_no || '-'}\n• **Job Date:** ${r.jb_date || '-'}\n• **Veh No:** ${r.veh_no || '-'}\n` +
           `• **Customer:** ${r.customer || '-'}\n• **Inv No:** ${r.inv_no || '-'}\n• **Chk Date:** ${r.chk_date || '-'}\n` +
           `• **Remarks:** ${r.remarks || '-'}\n• **Job Status:** ${r.job_status || '-'}\n• **Handover To:** ${r.handover_to || '-'}`;
  }
  let tableHtml = `<div style="overflow-x:auto"><table style="width:100%;font-size:12px;margin-top:10px;border-collapse:collapse;border:1px solid #e2e8f0">
    <thead><tr style="background:#f1f5f9"><th style="padding:5px;border:1px solid #e2e8f0">Sheet</th><th style="padding:5px;border:1px solid #e2e8f0">Job No</th><th style="padding:5px;border:1px solid #e2e8f0">Date</th><th style="padding:5px;border:1px solid #e2e8f0">Veh</th><th style="padding:5px;border:1px solid #e2e8f0">Customer</th><th style="padding:5px;border:1px solid #e2e8f0">Inv No</th><th style="padding:5px;border:1px solid #e2e8f0">Status</th></tr></thead><tbody>`;
  rows.forEach(r => {
    tableHtml += `<tr><td style="padding:5px;border:1px solid #e2e8f0">${SHEET_NAMES[r.sheet]}</td><td style="padding:5px;border:1px solid #e2e8f0">${esc(r.job_no||'-')}</td><td style="padding:5px;border:1px solid #e2e8f0">${esc(r.jb_date||'-')}</td><td style="padding:5px;border:1px solid #e2e8f0">${esc(r.veh_no||'-')}</td><td style="padding:5px;border:1px solid #e2e8f0">${esc(r.customer||'-')}</td><td style="padding:5px;border:1px solid #e2e8f0">${esc(r.inv_no||'-')}</td><td style="padding:5px;border:1px solid #e2e8f0">${esc(r.job_status||'-')}</td></tr>`;
  });
  tableHtml += `</tbody></table></div>`;
  const printBtnId = 'print_btn_' + Date.now();
  setTimeout(() => { const btn = document.getElementById(printBtnId); if(btn) btn.onclick = () => printTable(rows); }, 100);
  return `📋 Found **${rows.length}** records.<br><button id="${printBtnId}" style="margin-top:8px;padding:6px 12px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:600">🖨️ Print Results</button>` + tableHtml;
}

async function botQuery(qRaw){
  const q = qRaw.toLowerCase().trim();
  if(!q) return 'ප්‍රශ්නයක් අහන්න 🙂';
  if(/^(help|උදව්)/.test(q)) return `🤖 Search: "183985", "RTN jobs", "Seal issues"`;

  let filtered = allData;
  let desc = [];

  const numTerms = (qRaw.match(/[a-zA-Z0-9]+/g) || []).filter(t => t.length >= 3);
  if (numTerms.length > 0) {
      filtered = filtered.filter(r => {
          const rowStr = norm(JSON.stringify(r));
          return numTerms.some(term => rowStr.includes(norm(term)));
      });
      if (filtered.length < allData.length) desc.push('Search: ' + numTerms.join(' '));
  }

  if (/\brtn\b|return/.test(q)) { filtered = filtered.filter(r => /RTN/i.test(r.job_status || '')); desc.push('Status: RTN'); }
  else if (/chkd|checked/.test(q)) { filtered = filtered.filter(r => /CHKD/i.test(r.job_status || '')); desc.push('Status: CHKD'); }
  if (/seal/.test(q) && /(no|missing|issue|dif|❌)/.test(q)) { filtered = filtered.filter(r => /❌/.test(r.customer_seal || '')); desc.push('Seal issues'); }

  if (desc.length > 0 && filtered.length === 0) {
      return `❌ "${qRaw}" සඳහා කිසිදු විස්තරයක් හමු නොවිණි.\n\nℹ️ Database: Dankotuwa (${allData.filter(r=>r.sheet==='dankotuwa').length} rows), Royal (${allData.filter(r=>r.sheet==='royal').length} rows).`;
  }

  const t = filtered.reduce((a, r) => a + num(r.amount), 0);
  let summary = `📋 **Results** ${desc.length ? '`('+desc.join(', ')+')`' : ''}\nRecords: **${filtered.length}** | Total: **Rs ${money(t)}**\n\n`;
  return summary + formatFullDetails(filtered);
}

function startNewEntry(){
  botState = { mode:'new_entry', sheet:null, data:{}, step:-1 };
  addMsg(`📝 **New Job Entry Started**\n\nමේ job එක එකතු කරන්නේ කොහෙද?\nType හෝ කියන්න: **Dankotuwa** හෝ **Royal**`, 'bot');
}

$('#btnAiNewJob').addEventListener('click', () => {
  if(role !== 'admin') return;
  startNewEntry();
});

function processNewEntry(q){
  const text = q.trim();
  const lower = text.toLowerCase();

  if(lower === 'cancel' || lower === 'stop'){
    botState.mode = 'query';
    return '❌ New job entry cancelled.';
  }

  if(botState.step === -1) {
    if(lower.includes('dank') || lower.includes('old')) { botState.sheet = 'dankotuwa'; }
    else if(lower.includes('roy') || lower.includes('frn')) { botState.sheet = 'royal'; }
    else { return '❓ කරුණාකර **Dankotuwa** හෝ **Royal** කියලා type කරන්න.'; }
    
    botState.step = 0;
    return `✅ Sheet: ${SHEET_NAMES[botState.sheet]}\n\n1️⃣ **INV NO** එක type කරන්න හෝ කියන්න:`;
  }

  const fields = botState.fieldsToFill;
  if(botState.step < fields.length) {
    const field = fields[botState.step];
    const dbKey = FIELD_KEYS[field];
    botState.data[dbKey] = text;
    
    if(field === 'CUSTOMER SEAL' && !text.includes('✅') && !text.includes('❌')) {
       botState.data[dbKey] = '✅ ' + text;
    }
    
    botState.step++;
    
    if(botState.step < fields.length) {
      return `✅ ${field}: **${text}**\n\n${botState.step + 1}️⃣ **${fields[botState.step]}** type කරන්න හෝ කියන්න:`;
    } else {
      return `✅ ${field}: **${text}**\n\n📋 **සියලුම විස්තර ලැබුණා!**\nType **"save"** to save or **"cancel"**:`;
    }
  }

  if(botState.step === fields.length) {
    if(lower === 'save' || lower === 'yes' || lower === 'ok') {
      botState.data.sheet = botState.sheet;
      botState.data.entered_at = new Date().toISOString();
      return { action: 'save_new_entry', data: botState.data };
    } else {
      return '❓ Save කරන්න ඕන නම් **"save"** කියන්න. අවලංගු කරන්න **"cancel"** කියන්න.';
    }
  }
  return '';
}

async function handleChat(q){
  if(botState.mode === 'new_entry'){
    const res = processNewEntry(q);
    if(typeof res === 'object' && res.action === 'save_new_entry') {
      await syncAction('add', res.data);
      botState.mode = 'query';
      await fetchData();
      return `🎉 **Job Successfully Saved!**\nSheet: ${SHEET_NAMES[res.data.sheet]}\nINV: ${res.data.inv_no}`;
    }
    return res;
  }
  return await botQuery(q);
}

function addMsg(text, who){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = who==='bot' ? text.replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>') : esc(text);
  $('#chatLog').appendChild(div);
  $('#chatLog').scrollTop = $('#chatLog').scrollHeight;
  return div;
}

async function sendChat(){
  const box = $('#chatBox'), q = box.value.trim();
  if(!q) return;
  addMsg(q, 'user'); box.value = '';
  const loading = addMsg('⏳...', 'bot');
  
  try {
    let ans = await handleChat(q);
    if(ans === null) { loading.remove(); return; }
    loading.innerHTML = String(ans).replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  } catch(e) { loading.innerHTML = '❌ Error: ' + esc(e.message); }
  $('#chatLog').scrollTop = $('#chatLog').scrollHeight;
}

$('#chatSend')?.addEventListener('click', sendChat);
$('#chatBox')?.addEventListener('keydown', e => { if(e.key==='Enter') sendChat(); });

function renderAll(){
  if($('#tab-dash').classList.contains('active')) renderDash();
  if($('#tab-grid').classList.contains('active')) renderGrid();
}

$$('nav button').forEach(btn => btn.addEventListener('click', () => {
  const t = btn.dataset.tab;
  $$('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  $$('.tab').forEach(s => s.classList.remove('active'));

    cur = t; page = 1;

    if(t==='bot'){

       $$('#chips .chip').forEach(ch => ch.addEventListener('click', () => {
         $('#chatBox').value = ch.textContent; sendChat();
       }));
       if(!$('#chatLog').children.length) addMsg('👋 ආයුබෝවන්! මම Check Sheet Assistant.\n\n🔹 **Search:** Job No / Inv No (උදා: 183985)\n🔹 **New Job:** උඩ තියෙන "➕ Start New Job" බටන් එක ඔබන්න.\n\n"help" type කරලා බලන්න 🤖', 'bot');
    }
  }
}));
